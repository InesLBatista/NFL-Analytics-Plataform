services:

  postgres:
    image: postgres:16-alpine
    container_name: nfl_postgres
    environment:
      POSTGRES_DB: nfl_analytics
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      #persist data between restarts
      - postgres_data:/var/lib/postgresql/data
    ports:
      #exposed only for local inspection via psql or a DB client
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d nfl_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nfl_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nfl_analytics
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      #exposed only for direct API access during development
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nfl_frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
