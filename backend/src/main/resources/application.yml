spring:
  application:
    name: nfl-analytics

  datasource:
    url:      ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nfl_analytics}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          #because of the play_by_play requests
          batch_size: 50  
        order_inserts: true
        order_updates: true

server:
  port: 8080

cors:
  allowed-origins: http://localhost:5173

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:changeme123}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}